name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Check bundled script template
        run: python scripts/script_check.py assets/script-template.md --blocks 6
      - name: Smoke-test fallback assembler
        run: |
          mkdir -p tmp && cd tmp
          ffmpeg -v error -f lavfi -i testsrc=size=720x1280:rate=24 -f lavfi -i sine=f=220 -t 10 -shortest c1.mp4
          ffmpeg -v error -f lavfi -i testsrc=size=720x1280:rate=24 -t 8 c2.mp4
          ffmpeg -v error -f lavfi -i sine=f=440 -t 9.5 v1.mp3
          ffmpeg -v error -f lavfi -i sine=f=660 -t 10.8 v2.mp3
          python ../scripts/assemble_fallback.py --clip c1.mp4 --voice v1.mp3 --clip c2.mp4 --voice v2.mp3 -o final.mp4
